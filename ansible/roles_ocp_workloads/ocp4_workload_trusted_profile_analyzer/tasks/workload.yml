---
- name: Retrieve Ingress config
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: r_ingress_config

- name: Set ingress domain fact
  ansible.builtin.set_fact:
    ocp4_workload_trusted_profile_analyzer_ingress_domain: "{{ r_ingress_config.resources[0].spec.domain }}"

- name: Set Keycloak host fact
  when: ocp4_workload_trusted_profile_analyzer_keycloak_host | length == 0
  ansible.builtin.set_fact:
    ocp4_workload_trusted_profile_analyzer_keycloak_host: "keycloak-{{ ocp4_workload_trusted_profile_analyzer_keycloak_namespace }}.{{ ocp4_workload_trusted_profile_analyzer_ingress_domain }}"

- name: Set OIDC issuer URL for existing Keycloak realm
  when: ocp4_workload_trusted_profile_analyzer_oidc_issuer_url | length == 0
  ansible.builtin.set_fact:
    ocp4_workload_trusted_profile_analyzer_oidc_issuer_url: "https://{{ ocp4_workload_trusted_profile_analyzer_keycloak_host }}{{ ocp4_workload_trusted_profile_analyzer_keycloak_base_path }}/realms/{{ ocp4_workload_trusted_profile_analyzer_keycloak_realm }}"

- name: Ensure TPA namespace exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_trusted_profile_analyzer_namespace }}"
        labels:
          app: trusted-profile-analyzer

- name: Remove previous MinIO bucket Job
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: tpa-minio-create-bucket
    namespace: "{{ ocp4_workload_trusted_profile_analyzer_namespace }}"
    wait: true
    wait_timeout: 120

- name: Deploy MinIO object storage
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'minio.yml.j2') | from_yaml_all | list }}"

- name: Deploy PostgreSQL database
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'postgresql.yml.j2') | from_yaml_all | list }}"

- name: Create OIDC CLI client secret
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'oidc-cli-secret.yml.j2') | from_yaml_all | list }}"

- name: Wait for MinIO deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: tpa-minio
    namespace: "{{ ocp4_workload_trusted_profile_analyzer_namespace }}"
  register: r_tpa_minio
  retries: 60
  delay: 10
  until:
  - r_tpa_minio.resources | length > 0
  - r_tpa_minio.resources[0].status.readyReplicas | default(0) | int >= 1

- name: Wait for PostgreSQL deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: tpa-postgresql
    namespace: "{{ ocp4_workload_trusted_profile_analyzer_namespace }}"
  register: r_tpa_postgres
  retries: 60
  delay: 10
  until:
  - r_tpa_postgres.resources | length > 0
  - r_tpa_postgres.resources[0].status.readyReplicas | default(0) | int >= 1

- name: Wait for MinIO bucket Job to complete
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: tpa-minio-create-bucket
    namespace: "{{ ocp4_workload_trusted_profile_analyzer_namespace }}"
  register: r_tpa_minio_bucket
  retries: 60
  delay: 10
  until:
  - r_tpa_minio_bucket.resources | length > 0
  - r_tpa_minio_bucket.resources[0].status.succeeded | default(0) | int >= 1

- name: Remove obsolete TPA walker KeycloakClient
  when: ocp4_workload_trusted_profile_analyzer_create_keycloak_clients | bool
  kubernetes.core.k8s:
    state: absent
    api_version: keycloak.org/v1alpha1
    kind: KeycloakClient
    name: tpa-walker
    namespace: "{{ ocp4_workload_trusted_profile_analyzer_keycloak_namespace }}"

- name: Create TPA Keycloak clients in existing openshift realm
  when: ocp4_workload_trusted_profile_analyzer_create_keycloak_clients | bool
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) }}"
  loop:
  - keycloak-client-frontend.yml.j2
  - keycloak-client-cli.yml.j2

- name: Remove previous TPA Keycloak configuration Job
  when: ocp4_workload_trusted_profile_analyzer_configure_keycloak_realm | bool
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: tpa-configure-keycloak
    namespace: "{{ ocp4_workload_trusted_profile_analyzer_keycloak_namespace }}"
    wait: true
    wait_timeout: 120

- name: Configure TPA client scopes and assign roles in existing Keycloak
  when: ocp4_workload_trusted_profile_analyzer_configure_keycloak_realm | bool
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'keycloak-configure-tpa-job.yml.j2') }}"

- name: Wait for TPA Keycloak configuration Job to complete
  when: ocp4_workload_trusted_profile_analyzer_configure_keycloak_realm | bool
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: tpa-configure-keycloak
    namespace: "{{ ocp4_workload_trusted_profile_analyzer_keycloak_namespace }}"
  register: r_tpa_keycloak_job
  retries: 60
  delay: 10
  until:
  - r_tpa_keycloak_job.resources | length > 0
  - r_tpa_keycloak_job.resources[0].status is defined
  - r_tpa_keycloak_job.resources[0].status.succeeded | default(0) | int >= 1

- name: Template RHTPA values file to remote host
  ansible.builtin.template:
    src: templates/values-rhtpa.yml.j2
    dest: ~{{ ansible_user }}/values-rhtpa.yml

- name: Install / upgrade RHTPA Helm chart
  environment:
    NAMESPACE: "{{ ocp4_workload_trusted_profile_analyzer_namespace }}"
    TRUSTIFICATION_VALUES: "/home/{{ ansible_user }}/values-rhtpa.yml"
    HELM_SCHEMA_VALIDATION_TIMEOUT: "120"
  ansible.builtin.shell: |
    set -euo pipefail
    INGRESS_DOMAIN=$(oc --namespace=openshift-ingress-operator \
      get ingresscontrollers.operator.openshift.io default \
      --output=jsonpath='{.status.domain}')
    APP_DOMAIN="-${NAMESPACE}.${INGRESS_DOMAIN}"
    helm repo add openshift-helm-charts {{
      ocp4_workload_trusted_profile_analyzer_helm_chart_repo }} >/dev/null || true
    helm repo update openshift-helm-charts >/dev/null || true
    # Remove obsolete 0.x infrastructure release if present
    helm uninstall tpa-infrastructure --namespace "${NAMESPACE}" 2>/dev/null || true
    helm upgrade \
      --install \
      --namespace="${NAMESPACE}" \
      --timeout=20m \
      --values="${TRUSTIFICATION_VALUES}" \
      --version={{ ocp4_workload_trusted_profile_analyzer_helm_chart_version }} \
      --set-string appDomain="${APP_DOMAIN}" \
      --debug \
      {{ ocp4_workload_trusted_profile_analyzer_helm_release_name }} \
      {{ ocp4_workload_trusted_profile_analyzer_helm_chart_name }}
  register: r_tpa_output

- name: Show output log
  ansible.builtin.debug:
    msg: "{{ r_tpa_output.stdout }}"

- name: Save user data
  agnosticd_user_info:
    data:
      tpa_console_url: https://server-{{ ocp4_workload_trusted_profile_analyzer_namespace }}.{{
        ocp4_workload_trusted_profile_analyzer_ingress_domain }}
      tpa_oidc_issuer_url: "{{ ocp4_workload_trusted_profile_analyzer_oidc_issuer_url }}"
      tpa_oidc_realm: "{{ ocp4_workload_trusted_profile_analyzer_keycloak_realm }}"
      tpa_oidc_frontend_client_id: "{{ ocp4_workload_trusted_profile_analyzer_oidc_frontend_client_id }}"
      tpa_oidc_cli_client_id: "{{ ocp4_workload_trusted_profile_analyzer_oidc_cli_client_id }}"
      tpa_keycloak_user: "{{ ocp4_workload_trusted_profile_analyzer_keycloak_user }}"
      tpa_helm_chart_version: "{{ ocp4_workload_trusted_profile_analyzer_helm_chart_version }}"
